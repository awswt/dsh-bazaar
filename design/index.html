<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsh-bazaar · 能力集市面板 UI 重设计原型</title>
    <style>
      /* =====================================================================
         DSH Host Token Simulation (模拟 DSH 宿主 --dsw-alias-* 主题变量)
         插件本身不提供单独配色页，完全跟随 DSH 的浅色 / 深色宿主配置；
         插件所有前景色与状态色均通过 --dsw-alias-* 与 color-mix() 自适应对比度。
         ===================================================================== */
      :root {
        --dsw-alias-bg-canvas: #f5f6f8;
        --dsw-alias-bg-layer-1: #ffffff;
        --dsw-alias-bg-layer-2: #f3f4f6;
        --dsw-alias-interactive-bg-hover: #f2f3f5;
        --dsw-alias-label-primary: #0f1115;
        --dsw-alias-label-secondary: #4e545e;
        --dsw-alias-label-tertiary: #6e7582;
        --dsw-alias-border-l1: rgba(15, 17, 21, 0.09);
        --dsw-alias-border-l2: rgba(15, 17, 21, 0.16);
        --dsw-alias-state-business-primary: #3b82f6;
        --dsw-alias-state-success-primary: #16a34a;
        --dsw-alias-state-warn-primary: #d97706;
        --dsw-alias-state-error-primary: #dc2626;
        --dsw-alias-bg-mask-1: rgba(15, 17, 21, 0.34);
        --dsw-radius-sm: 8px;
        --dsw-radius-md: 12px;
        --dsw-radius-lg: 16px;
        --dsw-canvas-ambient: radial-gradient(
          900px 420px at 50% 0%,
          rgba(59, 130, 246, 0.06),
          transparent 70%
        );
        --dsw-shadow-card: 0 10px 36px rgba(15, 17, 21, 0.07), 0 2px 6px rgba(15, 17, 21, 0.04);
        --dsw-shadow-modal: 0 24px 64px rgba(15, 17, 21, 0.18), 0 4px 16px rgba(15, 17, 21, 0.08);
        --dsw-composer-glass: rgba(255, 255, 255, 0.96);
      }

      body[data-ds-dark-theme='true'] {
        --dsw-alias-bg-canvas: #121417;
        --dsw-alias-bg-layer-1: #1b1e23;
        --dsw-alias-bg-layer-2: #252931;
        --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.07);
        --dsw-alias-label-primary: #f3f5f8;
        --dsw-alias-label-secondary: #c5ccd6;
        --dsw-alias-label-tertiary: #9aa2af;
        --dsw-alias-border-l1: rgba(255, 255, 255, 0.1);
        --dsw-alias-border-l2: rgba(255, 255, 255, 0.18);
        --dsw-alias-state-business-primary: #60a5fa;
        --dsw-alias-state-success-primary: #4ade80;
        --dsw-alias-state-warn-primary: #fbbf24;
        --dsw-alias-state-error-primary: #f87171;
        --dsw-alias-bg-mask-1: rgba(0, 0, 0, 0.62);
        --dsw-canvas-ambient:
          radial-gradient(780px 380px at 30% 62%, rgba(202, 138, 4, 0.12), transparent 65%),
          radial-gradient(640px 380px at 72% 70%, rgba(22, 163, 74, 0.1), transparent 65%);
        --dsw-shadow-card: 0 18px 48px rgba(0, 0, 0, 0.48), 0 2px 8px rgba(0, 0, 0, 0.28);
        --dsw-shadow-modal: 0 28px 72px rgba(0, 0, 0, 0.68);
        --dsw-composer-glass: rgba(34, 38, 44, 0.88);
      }

      /* =====================================================================
         Plugin Semantic Tokens (仅消费 --dsw-alias-* + color-mix，确保深浅双态高对比)
         ===================================================================== */
      body {
        --bz-canvas: var(--dsw-alias-bg-canvas);
        --bz-bg: var(--dsw-alias-bg-layer-1);
        --bz-bg-alt: var(--dsw-alias-bg-layer-2);
        --bz-row-hover: var(--dsw-alias-interactive-bg-hover);
        --bz-fg: var(--dsw-alias-label-primary);
        --bz-fg-secondary: var(--dsw-alias-label-secondary);
        /* 次要说明文字往 primary 混入少量占比，保证在深/浅底色下均稳定可读 */
        --bz-fg-dim: color-mix(
          in srgb,
          var(--dsw-alias-label-tertiary) 86%,
          var(--dsw-alias-label-primary)
        );
        --bz-border: var(--dsw-alias-border-l1);
        --bz-border-strong: var(--dsw-alias-border-l2);
        --bz-accent: var(--dsw-alias-state-business-primary);
        --bz-accent-fg: color-mix(in srgb, var(--bz-accent) 76%, var(--bz-fg));
        --bz-accent-bg: color-mix(in srgb, var(--bz-accent) 14%, var(--bz-bg));
        --bz-accent-ring: color-mix(in srgb, var(--bz-accent) 24%, transparent);
        --bz-row-active: color-mix(in srgb, var(--bz-accent) 12%, var(--bz-bg));
        --bz-ok: var(--dsw-alias-state-success-primary);
        --bz-ok-fg: color-mix(in srgb, var(--bz-ok) 68%, var(--bz-fg));
        --bz-ok-bg: color-mix(in srgb, var(--bz-ok) 15%, var(--bz-bg));
        --bz-ok-line: color-mix(in srgb, var(--bz-ok) 42%, var(--bz-bg));
        --bz-warn: var(--dsw-alias-state-warn-primary);
        --bz-warn-fg: color-mix(in srgb, var(--bz-warn) 68%, var(--bz-fg));
        --bz-warn-bg: color-mix(in srgb, var(--bz-warn) 16%, var(--bz-bg));
        --bz-warn-line: color-mix(in srgb, var(--bz-warn) 42%, var(--bz-bg));
        --bz-err: var(--dsw-alias-state-error-primary);
        --bz-err-fg: color-mix(in srgb, var(--bz-err) 72%, var(--bz-fg));
        --bz-err-bg: color-mix(in srgb, var(--bz-err) 15%, var(--bz-bg));
        --bz-err-line: color-mix(in srgb, var(--bz-err) 42%, var(--bz-bg));
        --bz-scrim: var(--dsw-alias-bg-mask-1);
        --bz-btn-primary-bg: var(--bz-fg);
        --bz-btn-primary-fg: var(--bz-bg);
        --bz-r-xs: 6px;
        --bz-r-sm: var(--dsw-radius-sm);
        --bz-r-md: var(--dsw-radius-md);
        --bz-r-lg: var(--dsw-radius-lg);
        --bz-r-full: 999px;
        --bz-font-sans:
          'PingFang SC', 'Microsoft YaHei UI', 'Segoe UI', system-ui, -apple-system, sans-serif;
        --bz-font-mono: 'JetBrains Mono', 'Cascadia Code', ui-monospace, Consolas, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bz-canvas);
        background-image: var(--dsw-canvas-ambient);
        color: var(--bz-fg);
        font-family: var(--bz-font-sans);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--bz-accent);
        outline-offset: 2px;
      }

      .bz-mono {
        font-family: var(--bz-font-mono);
        font-size: 12px;
      }

      /* =====================================================================
         Prototype Control Header (仅原型评审切换：模拟 DSH 宿主设置，非插件内置配色页)
         ===================================================================== */
      .proto-bar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 7px 16px;
        background: var(--bz-bg);
        border-bottom: 1px solid var(--bz-border);
      }

      .proto-bar__brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .proto-bar__badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: var(--bz-r-full);
        background: var(--bz-accent-bg);
        color: var(--bz-accent-fg);
        font-size: 11px;
        font-weight: 600;
      }

      .proto-bar__title {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--bz-fg);
      }

      .proto-bar__controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .proto-seg {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border-radius: var(--bz-r-sm);
        background: var(--bz-bg-alt);
        border: 1px solid var(--bz-border);
      }

      .proto-seg__btn {
        height: 25px;
        padding: 0 9px;
        border: 0;
        border-radius: var(--bz-r-xs);
        background: transparent;
        color: var(--bz-fg-dim);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }

      .proto-seg__btn[data-active='true'] {
        background: var(--bz-bg);
        color: var(--bz-fg);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      .proto-state-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--bz-fg-dim);
      }

      /* =====================================================================
         Common Badges & Buttons (深浅色对比度均自适应)
         ===================================================================== */
      .bz-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 7px;
        border-radius: var(--bz-r-full);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        border: 1px solid transparent;
      }

      .bz-tag[data-kind='ok'] {
        background: var(--bz-ok-bg);
        color: var(--bz-ok-fg);
      }
      .bz-tag[data-kind='warn'] {
        background: var(--bz-warn-bg);
        color: var(--bz-warn-fg);
      }
      .bz-tag[data-kind='error'],
      .bz-tag[data-kind='danger'],
      .bz-tag[data-kind='req'] {
        background: var(--bz-err-bg);
        color: var(--bz-err-fg);
        border-color: var(--bz-err-line);
      }
      .bz-tag[data-kind='info'] {
        background: var(--bz-accent-bg);
        color: var(--bz-accent-fg);
      }
      .bz-tag[data-kind='muted'],
      .bz-tag[data-kind='readonly'],
      .bz-tag[data-kind='disabled'] {
        background: var(--bz-bg-alt);
        color: var(--bz-fg-secondary);
        border-color: var(--bz-border);
      }

      .bz-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 30px;
        padding: 0 12px;
        border-radius: var(--bz-r-sm);
        border: 1px solid var(--bz-border-strong);
        background: var(--bz-bg);
        color: var(--bz-fg);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 0.12s ease,
          border-color 0.12s ease;
      }

      .bz-btn:hover:not(:disabled) {
        background: var(--bz-row-hover);
      }

      .bz-btn--sm {
        height: 26px;
        padding: 0 10px;
        font-size: 12px;
      }

      .bz-btn--primary {
        background: var(--bz-btn-primary-bg);
        border-color: var(--bz-btn-primary-bg);
        color: var(--bz-btn-primary-fg);
      }

      .bz-btn--primary:hover:not(:disabled) {
        opacity: 0.9;
        background: var(--bz-btn-primary-bg);
      }

      .bz-btn--accent {
        background: var(--bz-accent-bg);
        border-color: color-mix(in srgb, var(--bz-accent) 28%, transparent);
        color: var(--bz-accent-fg);
      }

      .bz-btn--accent:hover:not(:disabled) {
        background: var(--bz-accent-ring);
      }

      .bz-btn--danger {
        background: var(--bz-err-bg);
        border-color: var(--bz-err-line);
        color: var(--bz-err-fg);
      }

      .bz-btn--ghost {
        background: transparent;
        border-color: transparent;
        color: var(--bz-fg-secondary);
      }

      .bz-btn--ghost:hover:not(:disabled) {
        background: var(--bz-row-hover);
        color: var(--bz-fg);
      }

      .bz-btn:disabled {
        opacity: 0.52;
        cursor: not-allowed;
      }

      /* =====================================================================
         Screen B: DSH Conversation Stage + Doubao-Style Composer & Popover
         ===================================================================== */
      .stage-conversation {
        max-width: 1040px;
        margin: 0 auto;
        min-height: calc(100vh - 46px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 14px 20px 22px;
      }

      .host-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 4px 0 10px;
        gap: 6px;
      }

      .host-hero__avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
        color: #ffffff;
        font-weight: 700;
        font-size: 16px;
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.24);
      }

      .host-hero__title {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .host-hero__sub {
        margin: 0;
        font-size: 12.5px;
        color: var(--bz-fg-dim);
      }

      .host-active-banner {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        padding: 4px 12px;
        border-radius: var(--bz-r-full);
        background: var(--bz-bg);
        border: 1px solid var(--bz-border);
        font-size: 12px;
        color: var(--bz-fg-secondary);
      }

      .host-active-banner strong {
        color: var(--bz-fg);
        font-weight: 600;
      }

      .host-active-banner__clear {
        border: 0;
        background: transparent;
        color: var(--bz-fg-dim);
        cursor: pointer;
        padding: 0 2px;
        font-size: 12px;
      }

      .host-active-banner__clear:hover {
        color: var(--bz-err-fg);
      }

      .composer-wrap {
        position: relative;
        width: 100%;
        max-width: 880px;
        margin: 0 auto;
      }

      .composer-shell {
        position: relative;
        background: var(--dsw-composer-glass);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1.5px solid var(--bz-border-strong);
        border-radius: var(--bz-r-lg);
        box-shadow: var(--dsw-shadow-card);
        transition:
          border-color 0.16s ease,
          box-shadow 0.16s ease;
        overflow: hidden;
      }

      .composer-shell[data-open='true'] {
        border-color: var(--bz-accent);
        box-shadow:
          0 0 0 3px var(--bz-accent-ring),
          var(--dsw-shadow-card);
      }

      .bz-popover {
        display: flex;
        flex-direction: column;
        background: var(--bz-bg);
        border-bottom: 1px solid var(--bz-border);
        animation: bz-slide-up 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .bz-popover__filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--bz-border);
        background: var(--bz-bg);
      }

      .bz-filter-cluster {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .bz-filter-label {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--bz-fg-dim);
        margin-right: 2px;
      }

      .bz-source-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 9px;
        border-radius: var(--bz-r-full);
        border: 1px solid var(--bz-border-strong);
        background: var(--bz-bg);
        color: var(--bz-fg-secondary);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.12s ease;
      }

      .bz-source-pill:hover {
        background: var(--bz-row-hover);
        color: var(--bz-fg);
      }

      .bz-source-pill[data-on='true'] {
        background: var(--bz-accent-bg);
        border-color: color-mix(in srgb, var(--bz-accent) 42%, var(--bz-bg));
        color: var(--bz-accent-fg);
        font-weight: 600;
      }

      .bz-source-pill[data-error='true'] {
        border-color: var(--bz-err-line);
        background: var(--bz-err-bg);
        color: var(--bz-err-fg);
      }

      .bz-source-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.78;
      }

      .bz-cat-chip {
        height: 22px;
        padding: 0 8px;
        border-radius: var(--bz-r-full);
        border: 0;
        background: transparent;
        color: var(--bz-fg-dim);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }

      .bz-cat-chip:hover {
        background: var(--bz-row-hover);
        color: var(--bz-fg);
      }

      .bz-cat-chip[data-on='true'] {
        background: var(--bz-bg-alt);
        color: var(--bz-fg);
        font-weight: 600;
      }

      .bz-popover__list {
        max-height: 296px;
        overflow-y: auto;
        padding: 8px 8px 6px;
      }

      .bz-popover__list::-webkit-scrollbar {
        width: 5px;
      }
      .bz-popover__list::-webkit-scrollbar-thumb {
        background: var(--bz-border-strong);
        border-radius: 999px;
      }

      .bz-group-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px 4px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--bz-fg-dim);
      }

      .bz-doubao-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 10px;
        border-radius: var(--bz-r-sm);
        cursor: pointer;
        transition: background-color 0.1s ease;
        border: 1px solid transparent;
      }

      .bz-doubao-row:hover {
        background: var(--bz-row-hover);
      }

      .bz-doubao-row[data-selected='true'] {
        background: var(--bz-row-active);
      }

      .bz-doubao-row[data-disabled='true'] {
        opacity: 0.72;
        cursor: not-allowed;
      }

      .bz-doubao-row__main {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }

      .bz-doubao-row__icon {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--bz-bg-alt);
        color: var(--bz-fg-secondary);
      }

      .bz-doubao-row__icon[data-tone='blue'] {
        background: color-mix(in srgb, #3b82f6 15%, var(--bz-bg));
        color: color-mix(in srgb, #3b82f6 76%, var(--bz-fg));
      }
      .bz-doubao-row__icon[data-tone='green'] {
        background: color-mix(in srgb, #16a34a 15%, var(--bz-bg));
        color: color-mix(in srgb, #16a34a 74%, var(--bz-fg));
      }
      .bz-doubao-row__icon[data-tone='amber'] {
        background: color-mix(in srgb, #d97706 16%, var(--bz-bg));
        color: color-mix(in srgb, #d97706 74%, var(--bz-fg));
      }
      .bz-doubao-row__icon[data-tone='purple'] {
        background: color-mix(in srgb, #8b5cf6 16%, var(--bz-bg));
        color: color-mix(in srgb, #8b5cf6 76%, var(--bz-fg));
      }

      .bz-doubao-row__text {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }

      .bz-doubao-row__name {
        font-size: 13px;
        font-weight: 500;
        color: var(--bz-fg);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .bz-doubao-row__desc {
        font-size: 12px;
        color: var(--bz-fg-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bz-doubao-row__side {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .bz-view-all-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin: 4px 10px 6px 38px;
        padding: 4px 6px;
        border: 0;
        background: transparent;
        color: var(--bz-fg-dim);
        font-size: 12px;
        font-weight: 500;
        border-radius: var(--bz-r-xs);
        cursor: pointer;
      }

      .bz-view-all-link:hover {
        background: var(--bz-row-hover);
        color: var(--bz-accent-fg);
      }

      .bz-popover__searchbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-top: 1px solid var(--bz-border);
        background: var(--bz-bg);
      }

      .bz-popover__searchicon {
        color: var(--bz-fg-dim);
        display: inline-flex;
        flex-shrink: 0;
      }

      .bz-popover__searchinput {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        font-size: 13px;
        color: var(--bz-fg);
        outline: none;
      }

      .bz-popover__searchinput::placeholder {
        color: var(--bz-fg-dim);
      }

      .bz-popover__fullbtn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 10px;
        border-radius: var(--bz-r-full);
        border: 1px solid var(--bz-border);
        background: var(--bz-bg-alt);
        color: var(--bz-fg-secondary);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }

      .bz-popover__fullbtn:hover {
        border-color: var(--bz-accent);
        color: var(--bz-accent-fg);
        background: var(--bz-accent-bg);
      }

      .bz-inline-alert {
        margin: 4px 8px 8px;
        padding: 9px 12px;
        border-radius: var(--bz-r-sm);
        border: 1px solid var(--bz-err-line);
        background: var(--bz-err-bg);
        color: var(--bz-fg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
      }

      .bz-empty-box {
        padding: 24px 16px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .bz-empty-box__title {
        font-size: 13px;
        font-weight: 600;
        color: var(--bz-fg);
      }

      .bz-empty-box__desc {
        font-size: 12px;
        color: var(--bz-fg-dim);

      .bz-skel-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
      }

      .bz-skel-circle {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--bz-bg-alt);
      }

      .bz-skel-bar {
        height: 11px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          var(--bz-bg-alt) 25%,
          var(--bz-border) 50%,
          var(--bz-bg-alt) 75%
        );
        background-size: 200% 100%;
        animation: bz-shimmer 1.2s ease-in-out infinite;
      }

      .composer-input-area {
        padding: 12px 16px 4px;
      }

      .composer-shell[data-open='true'] .composer-input-area {
        display: none;
      }

      .composer-textarea {
        width: 100%;
        min-height: 44px;
        border: 0;
        background: transparent;
        resize: none;
        outline: none;
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--bz-fg);
      }

      .composer-textarea::placeholder {
        color: var(--bz-fg-dim);
      }

      .composer-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px 10px;
        flex-wrap: wrap;
      }

      .composer-toolbar__left {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 0;
      }

      .composer-toolbar__right {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      .host-tool-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 9px;
        border-radius: var(--bz-r-full);
        border: 0;
        background: transparent;
        color: var(--bz-fg-secondary);
        font-size: 12px;
        font-weight: 500;
        cursor: default;
        white-space: nowrap;
      }

      .host-tool-btn--circle {
        width: 28px;
        padding: 0;
        justify-content: center;
        background: var(--bz-bg-alt);
      }

      .host-divider {
        width: 1px;
        height: 16px;
        background: var(--bz-border-strong);
        margin: 0 2px;
      }

      .bz-pills-group {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex-wrap: nowrap;
      }

      .bz-pill-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 10px;
        border-radius: var(--bz-r-full);
        border: 1px solid transparent;
        background: var(--bz-bg-alt);
        color: var(--bz-fg-secondary);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.14s ease;
      }

      .bz-pill-btn:hover {
        background: var(--bz-row-hover);
        color: var(--bz-fg);
        border-color: var(--bz-border-strong);
      }

      .bz-pill-btn[data-active='true'],
      .bz-pill-btn[data-has-selection='true'] {
        background: var(--bz-accent-bg);
        color: var(--bz-accent-fg);
        border-color: color-mix(in srgb, var(--bz-accent) 34%, var(--bz-bg));
        font-weight: 600;
      }

      .bz-pill-btn[data-active='true'] {
        border-color: var(--bz-accent);
      }

      .bz-pill-btn__sub {
        max-width: 84px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
        opacity: 0.92;
      }

      .bz-pill-btn__chev {
        opacity: 0.65;
        display: inline-flex;
        transition: transform 0.14s ease;
      }

      .bz-pill-btn[data-active='true'] .bz-pill-btn__chev {
        transform: rotate(90deg);
        opacity: 1;
      }

      .host-send-btn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 0;
        background: var(--bz-btn-primary-bg);
        color: var(--bz-btn-primary-fg);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .host-meta-chip {
        font-size: 11.5px;
        color: var(--bz-fg-dim);
        white-space: nowrap;
      }

      /* =====================================================================
         Full Workbench Modal (完整面板)
         ===================================================================== */
      .bz-modal-scrim {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: var(--bz-scrim);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: bz-fade 0.14s ease-out;
      }

      .bz-modal {
        width: min(960px, 100%);
        max-height: min(84vh, 760px);
        display: flex;
        flex-direction: column;
        background: var(--bz-bg);
        border: 1px solid var(--bz-border-strong);
        border-radius: var(--bz-r-lg);
        box-shadow: var(--dsw-shadow-modal);
        overflow: hidden;
        animation: bz-slide-up 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .bz-modal__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--bz-border);
      }

      .bz-modal__title-wrap {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .bz-modal__title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      .bz-modal__sub {
        margin: 0;
        font-size: 12px;
        color: var(--bz-fg-dim);
      }

      .bz-modal__head-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .bz-icon-close {
        width: 28px;
        height: 28px;
        border-radius: var(--bz-r-sm);
        border: 1px solid var(--bz-border);
        background: var(--bz-bg);
        color: var(--bz-fg-dim);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .bz-icon-close:hover {
        background: var(--bz-row-hover);
        color: var(--bz-fg);
      }

      .bz-modal__nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--bz-border);
        background: var(--bz-bg-alt);
      }

      .bz-domain-tabs {
        display: inline-flex;
        gap: 4px;
        padding: 3px;
        border-radius: var(--bz-r-sm);
        background: var(--bz-bg);
        border: 1px solid var(--bz-border);
      }

      .bz-domain-tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: var(--bz-r-xs);
        background: transparent;
        color: var(--bz-fg-dim);
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
      }

      .bz-domain-tab[data-on='true'] {
        background: var(--bz-accent-bg);
        color: var(--bz-accent-fg);
        font-weight: 600;
      }

      .bz-provider-switches {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .bz-switch-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 28px;
        padding: 0 10px;
        border-radius: var(--bz-r-full);
        border: 1px solid var(--bz-border-strong);
        background: var(--bz-bg);
        font-size: 12px;
        cursor: pointer;
      }

      .bz-switch-track {
        width: 26px;
        height: 15px;
        border-radius: 999px;
        background: var(--bz-bg-alt);
        border: 1px solid var(--bz-border-strong);
        position: relative;
        transition: background-color 0.14s ease;
      }

      .bz-switch-track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--bz-fg-dim);
        transition:
          transform 0.14s ease,
          background-color 0.14s ease;
      }

      .bz-switch-pill[data-on='true'] .bz-switch-track {
        background: var(--bz-ok-bg);
        border-color: var(--bz-ok-line);
      }

      .bz-switch-pill[data-on='true'] .bz-switch-track::after {
        transform: translateX(11px);
        background: var(--bz-ok-fg);
      }

      .bz-modal__toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--bz-border);
      }

      .bz-search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 240px;
        max-width: 340px;
        height: 32px;
        padding: 0 10px;
        border-radius: var(--bz-r-sm);
        border: 1px solid var(--bz-border-strong);
        background: var(--bz-bg);
      }

      .bz-search-box input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        outline: none;
        font-size: 12.5px;
      }

      .bz-modal__body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 18px;
      }

      .bz-lib-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 14px;
      }

      .bz-lib-card {
        border: 1px solid var(--bz-border-strong);
        border-radius: var(--bz-r-md);
        background: var(--bz-bg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .bz-lib-card[data-muted='true'] {
        background: var(--bz-bg-alt);
      }

      .bz-lib-card[data-error='true'] {
        border-color: var(--bz-err-line);
      }

      .bz-lib-card__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--bz-border);
        background: var(--bz-bg-alt);
      }

      .bz-lib-card__name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
      }

      .bz-lib-card__body {
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .bz-workbench-item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 10px;
        border-radius: var(--bz-r-sm);
        border: 1px solid transparent;
      }

      .bz-workbench-item__main {
        flex: 1;
        min-width: 0;
      }

      .bz-workbench-item__side {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }

      .bz-workbench-item:hover {
        background: var(--bz-row-hover);
      }

      .bz-workbench-item[data-selected='true'] {
        background: var(--bz-row-active);
        border-color: color-mix(in srgb, var(--bz-accent) 30%, transparent);
      }

      .bz-workbench-item__title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
      }

      .bz-workbench-item__desc {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--bz-fg-dim);
      }

      .bz-subhead {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 6px 4px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--bz-fg-dim);
      }

      .bz-conflict-details {
        margin-top: 5px;
        font-size: 11.5px;
        color: var(--bz-fg-dim);
      }

      .bz-conflict-details summary {
        cursor: pointer;
        color: var(--bz-err-fg);
        font-weight: 500;
      }

      .bz-conflict-details p {
        margin: 4px 0 0;
        padding: 6px 8px;
        border-radius: var(--bz-r-xs);
        background: var(--bz-bg-alt);
      }

      .bz-modal__foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 18px;
        border-top: 1px solid var(--bz-border);
        font-size: 12px;
        color: var(--bz-fg-dim);
      }

      /* =====================================================================
         Screen A: Settings Page (Provider 栏 + 全局启用禁用 + 跟随 DSH 配色)
         ===================================================================== */
      .stage-settings {
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 20px 40px;
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 20px;
        align-items: start;
      }

      .settings-nav {
        background: var(--bz-bg);
        border: 1px solid var(--bz-border);
        border-radius: var(--bz-r-md);
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .settings-nav__item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: var(--bz-r-sm);
        font-size: 13px;
        color: var(--bz-fg-dim);
      }

      .settings-nav__item[data-active='true'] {
        background: var(--bz-accent-bg);
        color: var(--bz-accent-fg);
        font-weight: 600;
      }

      .settings-main {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .settings-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .settings-header h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      /* Provider 栏：标签明确标为 Provider，一个个 tab 切换不同 Provider */
      .settings-provider-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .settings-provider-bar__label {
        font-size: 12px;
        font-weight: 600;
        color: var(--bz-fg-dim);
      }

      .settings-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        overflow-x: auto;
      }

      .settings-tab {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 14px;
        border-radius: var(--bz-r-full);
        border: 1px solid var(--bz-border-strong);
        background: var(--bz-bg);
        color: var(--bz-fg-secondary);
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
      }

      .settings-tab[data-on='true'] {
        background: var(--bz-accent-bg);
        border-color: var(--bz-accent);
        color: var(--bz-accent-fg);
        font-weight: 600;
      }

      .settings-tab[data-disabled='true'] {
        opacity: 0.78;
      }

      .settings-tab[data-error='true'] {
        border-color: var(--bz-err-line);
        color: var(--bz-err-fg);
      }

      /* 当前 Provider 状态与全局启用/禁用控制卡 */
      .settings-provider-banner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-radius: var(--bz-r-md);
        border: 1px solid var(--bz-border);
        background: var(--bz-bg);
      }

      .settings-provider-banner[data-enabled='false'] {
        background: var(--bz-bg-alt);
      }

      .settings-provider-banner__meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .settings-provider-banner__title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
      }

      .settings-provider-banner__desc {
        margin: 0;
        font-size: 12px;
        color: var(--bz-fg-dim);
      }

      .settings-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .settings-grid[data-muted='true'] .settings-card {
        opacity: 0.78;
      }

      .settings-card {
        background: var(--bz-bg);
        border: 1px solid var(--bz-border);
        border-radius: var(--bz-r-md);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .settings-card__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .settings-card__title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .settings-field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .settings-field__label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--bz-fg-secondary);
      }

      .settings-field__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .settings-field__hint {
        margin: 0;
        font-size: 12px;
        color: var(--bz-fg-dim);
      }

      .settings-field__hint--error {
        color: var(--bz-err-fg);
      }

      .bz-select {
        height: 32px;
        padding: 0 10px;
        border-radius: var(--bz-r-sm);
        border: 1px solid var(--bz-border-strong);
        background: var(--bz-bg);
        font-size: 12.5px;
        min-width: 240px;
      }

      .bz-select[aria-invalid='true'] {
        border-color: var(--bz-err);
      }

      .settings-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .settings-list li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--bz-border);
      }

      .settings-list li:first-child {
        border-top: 0;
        padding-top: 2px;
      }

      .bz-toast-floating {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 80;
        padding: 9px 14px;
        border-radius: var(--bz-r-sm);
        background: var(--bz-fg);
        color: var(--bz-bg);
        font-size: 12.5px;
        font-weight: 500;
        box-shadow: var(--dsw-shadow-card);
        animation: bz-slide-up 0.16s ease-out;
      }

      .bz-toast-floating[data-kind='error'] {
        background: var(--bz-err-fg);
        color: #ffffff;
      }

      @keyframes bz-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes bz-slide-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bz-shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @media (max-width: 760px) {
        .stage-settings {
          grid-template-columns: 1fr;
        }
        .settings-grid {
          grid-template-columns: 1fr;
        }
        .bz-lib-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

          const matchingProviders = new Set(

          return matchingProviders.size > 1

          const q = queryText.trim().toLowerCase()
          const allowedInSettings = enabledProvidersInSettings().map((p) => p.id)
          const activeIds = sessionActiveProviderIds()
          let source = kind === 'expert' ? EXPERTS : kind === 'skill' ? SKILLS : CONNECTORS

          return source.filter((item) => {
            if (!allowedInSettings.includes(item.providerId)) return false
            if (respectSessionActive && !activeIds.includes(item.providerId)) return false
            if (state.previewMode === 'partial-error' && item.providerId === 'demo') return false
            if (categoryId !== 'all') {
              if (kind === 'expert' && item.category !== categoryId) return false
              if (kind === 'skill') {
                if (categoryId === 'installed' && !isSkillInstalled(item)) return false
                if (
                  (categoryId === 'skillMarket' || categoryId === 'memoryMarket') &&
                  item.source !== categoryId
                ) {
                  return false
                }
              }
              if (kind === 'connector') {
                if (categoryId === 'local' && item.catalogOnly) return false
                if (categoryId === 'catalog' && !item.catalogOnly) return false
                if (categoryId === 'authed' && !state.connectorAuthed[item.id]) return false
              }
            }
            if (q !== '') {
              const hay = (
                item.name +
                ' ' +
                item.desc +
                ' ' +
                (item.slug || '') +
                ' ' +
                providerName(item.providerId)
              ).toLowerCase()
              if (!hay.includes(q)) return false
            }
            return true
