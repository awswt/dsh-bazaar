                <div class="bz-skel-row" aria-busy="true">
                  <div class="bz-skel-circle"></div>
                  <div class="bz-skel-bar" style="width:${i % 2 === 0 ? '26%' : '20%'}"></div>
                  <div class="bz-skel-bar" style="width:${i % 2 === 0 ? '54%' : '46%'}"></div>
                </div>
              `,
              )
              .join('')
          } else if (state.previewMode === 'empty' || activeIds.length === 0) {
            const noActive = activeIds.length === 0
            bodyHtml = `
              <div class="bz-empty-box" role="status">
                <div class="bz-empty-box__title">${noActive ? '尚未选择会话来源' : '当前筛选下没有匹配条目'}</div>
                <div class="bz-empty-box__desc">${noActive ? '勾选上方任意来源即可展示对应能力，只影响当前会话。' : '尝试清空关键词或切换分类；不会影响其他已选来源。'}</div>
                <button type="button" class="bz-btn bz-btn--sm bz-btn--primary" data-action="${noActive ? 'enable-default-provider' : 'reset-filters'}">
                  ${noActive ? '启用 ' + esc(visibleProviders[0].shortName) : '清除筛选'}
                </button>
              </div>
            `
          } else {
            const errorBanner =
              state.previewMode === 'partial-error' && visibleProviders.some((p) => p.id === 'demo')
                ? `
                  <div class="bz-inline-alert" role="alert">
                    <span><strong>Demo</strong> 上游请求失败（500）：仅该来源分区受影响，其他来源列表正常可用。</span>
                    <button type="button" class="bz-btn bz-btn--sm" data-action="recover-error">重试</button>
                  </div>
                `
                : ''

            const filtered = filterItems(kind, state.searchQuery, state.category, true)
            if (filtered.length === 0) {
              bodyHtml =
                errorBanner +
                `
                <div class="bz-empty-box" role="status">
                  <div class="bz-empty-box__title">未找到匹配的${kind === 'expert' ? '专家' : kind === 'skill' ? '技能' : '连接器'}</div>
                  <div class="bz-empty-box__desc">暂无与「${esc(state.searchQuery || state.category)}」匹配的条目。</div>
                  <button type="button" class="bz-btn bz-btn--sm" data-action="reset-filters">查看全部</button>
                </div>
              `
            } else {
              const showLibBadge = activeIds.length > 1
              const recentItems =
                state.searchQuery.trim() === '' ? filtered.filter((x) => x.recent) : []
              const restItems =
                state.searchQuery.trim() === '' ? filtered.filter((x) => !x.recent) : filtered

              const recentTitle =
                kind === 'expert' ? '常用专家' : kind === 'skill' ? '常用技能' : '常用连接器'
              const restTitle =
                state.searchQuery.trim() !== ''
                  ? `匹配结果 (${restItems.length})`
                  : kind === 'expert'
                    ? `推荐专家 (${restItems.length})`
                    : kind === 'skill'
                      ? `市场与记忆 (${restItems.length})`
                      : `更多连接器 (${restItems.length})`

              const recentSection =
                recentItems.length > 0
                  ? `<div class="bz-group-title"><span>${recentTitle} (${recentItems.length})</span></div>
                     ${recentItems.map((it) => renderPopoverRow(kind, it, showLibBadge || hasSameNameAcrossVisible(it.name, filtered, activeIds))).join('')}`
                  : ''

              const restSection =
                restItems.length > 0
                  ? `<div class="bz-group-title"><span>${restTitle}</span></div>
                     ${restItems.map((it) => renderPopoverRow(kind, it, showLibBadge || hasSameNameAcrossVisible(it.name, filtered, activeIds))).join('')}`
                  : ''

              bodyHtml =
                errorBanner +
                recentSection +
                restSection +
                `<button type="button" class="bz-view-all-link" data-action="open-modal">查看全部与多来源对比 ›</button>`
            }
          }

          const placeholderMap = {
            expert: '搜索专家名称、专长领域…',
            skill: '搜索技能或记忆能力…',
            connector: '搜索连接器或工具…',
          }

          return `
            <div class="bz-popover" role="region" aria-label="能力集市快捷面板">
              <div class="bz-popover__filters">
                <div class="bz-filter-cluster">
                  <span class="bz-filter-label">来源</span>
                  ${sourcePills}
                </div>
                <div class="bz-filter-cluster" role="group" aria-label="分类筛选">
                  ${catChips}
                </div>
              </div>
              <div class="bz-popover__list">
                ${bodyHtml}
              </div>
              <div class="bz-popover__searchbar">
                <span class="bz-popover__searchicon">${ICONS.search}</span>
                <input
                  type="search"
                  class="bz-popover__searchinput"
                  data-role="popover-search"
                  placeholder="${placeholderMap[kind]}"
                  value="${esc(state.searchQuery)}"
                  aria-label="${placeholderMap[kind]}"
                />
                <button type="button" class="bz-popover__fullbtn" data-action="open-modal">
                  ${ICONS.grid}
                  <span>完整面板</span>
                </button>
              </div>
            </div>
          `
        }

        function renderConversationScreen() {
          const visibleIds = enabledProvidersInSettings().map((p) => p.id)
          const validExpert =
            state.selectedExpert && visibleIds.includes(state.selectedExpert.providerId)
              ? state.selectedExpert
              : null
          const activeExpName = validExpert ? validExpert.name : ''
          const installedCount = SKILLS.filter(
            (s) => visibleIds.includes(s.providerId) && isSkillInstalled(s),
          ).length
          const activeConnCount = CONNECTORS.filter(
            (c) =>
              visibleIds.includes(c.providerId) &&
              !c.catalogOnly &&
              state.connectorAuthed[c.id] &&
              !state.disabledConnectors[c.id],
          ).length

          return `
            <section class="stage-conversation" aria-label="会话工作区原型">
              <div class="host-hero">
                <div class="host-hero__avatar" aria-hidden="true">DS</div>
                <h1 class="host-hero__title">DeepSeek 工作区，让 AI 帮你干活</h1>
                <p class="host-hero__sub">
                  已从设置页过滤已禁用的 Provider；仅展示当前启用的来源能力
                </p>
                ${
                  validExpert
                    ? `<div class="host-active-banner">
                         <span>当前会话专家：</span>
                         <strong>${esc(providerName(validExpert.providerId))} · ${esc(validExpert.name)}</strong>
                         <button type="button" class="host-active-banner__clear" data-action="clear-expert" title="取消当前专家">✕ 退出</button>
                       </div>`
                    : `<div class="host-active-banner"><span>当前会话未指定专家（默认通用助手）</span></div>`
                }
              </div>

              <div class="composer-wrap">
                <div class="composer-shell" data-open="${Boolean(state.activeKind)}">
                  ${renderPopover()}

                  <div class="composer-input-area">
                    <textarea
                      class="composer-textarea"
                      rows="2"
                      placeholder="发消息或创建任务，/ 调用指令，@ 文件或对话"
                      aria-label="对话输入框"
                    ></textarea>
                  </div>

                  <div class="composer-toolbar">
                    <div class="composer-toolbar__left">
                      <span class="host-tool-btn host-tool-btn--circle" title="添加附件">${ICONS.plus}</span>
                      <span class="host-tool-btn">${ICONS.shield}<span>完全权限 ⌄</span></span>
                      <span class="host-tool-btn">${ICONS.desktop}<span>AI 控制电脑</span></span>
                      <span class="host-divider" aria-hidden="true"></span>

                      <div class="bz-pills-group" role="group" aria-label="能力集市入口">
                        <button
                          type="button"
                          class="bz-pill-btn"
                          data-kind="expert"
                          data-active="${state.activeKind === 'expert'}"
                          data-has-selection="${Boolean(activeExpName)}"
                          aria-expanded="${state.activeKind === 'expert'}"
                        >
                          ${ICONS.expert}
                          <span>专家</span>
                          ${activeExpName ? `<span class="bz-pill-btn__sub">· ${esc(activeExpName)}</span>` : ''}
                          <span class="bz-pill-btn__chev">${ICONS.chevron}</span>
                        </button>

                        <button
                          type="button"
                          class="bz-pill-btn"
                          data-kind="skill"
                          data-active="${state.activeKind === 'skill'}"
                          data-has-selection="${installedCount > 0}"
                          aria-expanded="${state.activeKind === 'skill'}"
                        >
                          ${ICONS.skill}
                          <span>技能</span>
                          ${installedCount > 0 ? `<span class="bz-pill-btn__sub">· ${installedCount}</span>` : ''}
                          <span class="bz-pill-btn__chev">${ICONS.chevron}</span>
                        </button>

                        <button
                          type="button"
                          class="bz-pill-btn"
                          data-kind="connector"
                          data-active="${state.activeKind === 'connector'}"
                          data-has-selection="${activeConnCount > 0}"
                          aria-expanded="${state.activeKind === 'connector'}"
                        >
                          ${ICONS.connector}
                          <span>连接器</span>
                          ${activeConnCount > 0 ? `<span class="bz-pill-btn__sub">· ${activeConnCount}</span>` : ''}
                          <span class="bz-pill-btn__chev">${ICONS.chevron}</span>
                        </button>
                      </div>
                    </div>

                    <div class="composer-toolbar__right">
                      <span class="host-meta-chip">DeepSeek V4.1 · WB CN</span>
                      <button type="button" class="host-send-btn" aria-label="发送消息">${ICONS.send}</button>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          `
        }

        function renderFullModal() {
          if (!state.modalOpen) return ''
          const visibleProviders = enabledProvidersInSettings()
          const activeIds = sessionActiveProviderIds()

          const switchesHtml =
            visibleProviders.length === 0
              ? `<span class="bz-tag" data-kind="muted">所有 Provider 已在设置页禁用</span>`
              : visibleProviders
                  .map((p) => {
                    const on = activeIds.includes(p.id)
                    return `
                      <button type="button" class="bz-switch-pill" role="switch" aria-checked="${on}" data-on="${on}" data-action="toggle-provider" data-provider="${p.id}">
                        <span class="bz-switch-track" aria-hidden="true"></span>
                        <span>${esc(p.displayName)}</span>
                        <span class="bz-tag" data-kind="${on ? 'ok' : 'muted'}">${on ? '已选' : '未选'}</span>
                      </button>
                    `
                  })
                  .join('')

          let gridHtml = ''

          if (visibleProviders.length === 0) {
            gridHtml = `
              <div class="bz-empty-box" role="status">
                <div class="bz-empty-box__title">暂无可展示的 Provider</div>
                <div class="bz-empty-box__desc">全部 Provider 已在设置页中禁用；禁用后不会出现在会话面板与工作台。</div>
                <button type="button" class="bz-btn bz-btn--sm bz-btn--primary" data-action="goto-settings">前往设置页启用</button>
              </div>
            `
          } else if (state.previewMode === 'loading') {
            gridHtml = `
              <div class="bz-lib-grid">
                ${visibleProviders
                  .map(
                    (p) => `
                  <div class="bz-lib-card">
                    <div class="bz-lib-card__head"><span class="bz-lib-card__name">${esc(p.displayName)}</span><span class="bz-tag" data-kind="info">加载中</span></div>
                    <div class="bz-lib-card__body">
                      <div class="bz-skel-row"><div class="bz-skel-bar" style="width:72%"></div></div>
                      <div class="bz-skel-row"><div class="bz-skel-bar" style="width:55%"></div></div>
                    </div>
                  </div>
                `,
                  )
                  .join('')}
              </div>
            `
          } else {
            gridHtml = `<div class="bz-lib-grid">${visibleProviders.map((provider) => renderProviderColumn(provider)).join('')}</div>`
          }

          return `
            <div class="bz-modal-scrim" data-action="close-modal-backdrop" role="presentation">
              <div class="bz-modal" role="dialog" aria-modal="true" aria-label="集市完整工作台">
                <div class="bz-modal__head">
                  <div class="bz-modal__title-wrap">
                    <h2 class="bz-modal__title">能力集市 · 完整工作台</h2>
                    <p class="bz-modal__sub">仅展示设置页已启用的 Provider：选专家、装技能与记忆、控制本会话连接器</p>
                  </div>
                  <div class="bz-modal__head-right">
                    ${
                      state.selectedExpert && state.providerEnabled[state.selectedExpert.providerId]
                        ? `<span class="bz-tag" data-kind="info">当前专家：${esc(state.selectedExpert.name)}</span>
                           <button type="button" class="bz-btn bz-btn--sm" data-action="clear-expert">退出专家</button>`
                        : `<span class="bz-tag" data-kind="muted">未选专家</span>`
                    }
                    <button type="button" class="bz-icon-close" data-action="close-modal" aria-label="关闭完整面板">
                      ${ICONS.close}
                    </button>
                  </div>
                </div>

                <div class="bz-modal__nav">
                  <div class="bz-domain-tabs" role="tablist" aria-label="工作台视图">
                    <button type="button" class="bz-domain-tab" role="tab" data-on="${state.modalTab === 'expert'}" data-action="modal-tab" data-tab="expert">${ICONS.expert} 专家</button>
                    <button type="button" class="bz-domain-tab" role="tab" data-on="${state.modalTab === 'skill'}" data-action="modal-tab" data-tab="skill">${ICONS.skill} 技能与记忆</button>
                    <button type="button" class="bz-domain-tab" role="tab" data-on="${state.modalTab === 'connector'}" data-action="modal-tab" data-tab="connector">${ICONS.connector} 连接器</button>
                  </div>
                  <div class="bz-provider-switches" role="group" aria-label="会话来源开关">
                    ${switchesHtml}
                  </div>
                </div>

                <div class="bz-modal__toolbar">
                  <div class="bz-search-box">
                    ${ICONS.search}
                    <input type="search" data-role="modal-search" placeholder="在当前工作台筛选…" value="${esc(state.modalSearchQuery)}" aria-label="在完整面板内筛选" />
                  </div>
                  <span class="bz-tag" data-kind="muted">会话隔离 · 关闭面板保留当前选择</span>
                </div>

                <div class="bz-modal__body">
                  ${gridHtml}
                </div>

                <div class="bz-modal__foot">
                  <span>提示：如要彻底启用/禁用某个 Provider 或配置账号与凭据，请前往「设置页」。</span>
                  <button type="button" class="bz-btn bz-btn--sm" data-action="close-modal">关闭（Esc）</button>
                </div>
              </div>
            </div>
          `
        }

        function renderProviderColumn(provider) {
          const enabled = sessionActiveProviderIds().includes(provider.id)
          const isError = state.previewMode === 'partial-error' && provider.id === 'demo'

          if (isError) {
            return `
              <section class="bz-lib-card" data-error="true">
                <div class="bz-lib-card__head">
                  <span class="bz-lib-card__name">${esc(provider.displayName)} <span class="bz-tag bz-mono" data-kind="muted">${provider.id}</span></span>
                  <span class="bz-tag" data-kind="error">出错</span>
                </div>
                <div class="bz-lib-card__body">
                  <div class="bz-inline-alert" role="alert" style="margin:6px 0">
                    <span>上游 500：只有本分区加载失败，其他来源照常显示。</span>
                    <button type="button" class="bz-btn bz-btn--sm" data-action="recover-error">重试</button>
                  </div>
                </div>
              </section>
            `
          }

          const q = state.modalSearchQuery.trim().toLowerCase()
          let contentHtml = ''

          if (state.modalTab === 'expert') {
            const list = EXPERTS.filter(
              (x) =>
                x.providerId === provider.id &&
                (q === '' || (x.name + ' ' + x.desc).toLowerCase().includes(q)),
            )
            contentHtml =
              state.previewMode === 'empty' || list.length === 0
                ? `<div class="bz-empty-box"><div class="bz-empty-box__title">暂无匹配专家</div></div>`
                : list
                    .map((item) => {
                      const current =
                        state.selectedExpert &&
                        state.selectedExpert.id === item.id &&
                        state.selectedExpert.providerId === provider.id
                      const actionBtn = !enabled
                        ? `<span class="bz-tag" data-kind="disabled">禁用：本会话未选中</span>`
                        : current
                          ? `<span class="bz-tag" data-kind="info">当前使用</span><button type="button" class="bz-btn bz-btn--sm" disabled>已选</button>`
                          : `<button type="button" class="bz-btn bz-btn--sm bz-btn--primary" data-action="pick-expert" data-id="${esc(item.id)}" data-provider="${provider.id}">选择</button>`
                      return `
                        <div class="bz-workbench-item" data-selected="${current}">
                          <div class="bz-workbench-item__main">
                            <div class="bz-workbench-item__title">${esc(item.name)}</div>
                            <p class="bz-workbench-item__desc">${esc(item.desc)}</p>
                          </div>
                          <div class="bz-workbench-item__side">${actionBtn}</div>
                        </div>
                      `
                    })
                    .join('')
          } else if (state.modalTab === 'skill') {
            const allForLib = SKILLS.filter(
              (x) =>
                x.providerId === provider.id &&
                (q === '' || (x.name + ' ' + x.slug + ' ' + x.desc).toLowerCase().includes(q)),
            )
            const marketSkills = allForLib.filter((x) => x.source === 'skillMarket')
            const memSkills = allForLib.filter((x) => x.source === 'memoryMarket')

            const renderSkillRow = (item) => {
              const conflict =
                state.previewMode === 'conflict' && item.conflictOwner
                  ? item.conflictOwner
                  : item.conflictOwner && state.installedSkills['workbuddy:' + item.slug]
                    ? item.conflictOwner
                    : null
              const installed = isSkillInstalled(item)
              let side = ''
              if (!enabled) {
                side = `<span class="bz-tag" data-kind="disabled">禁用：未选中</span>`
              } else if (conflict) {
                side = `<span class="bz-tag" data-kind="danger">冲突</span><button type="button" class="bz-btn bz-btn--sm" disabled>安装</button>`
              } else if (installed) {
                side = `<span class="bz-tag" data-kind="ok">已安装 · 只读</span><button type="button" class="bz-btn bz-btn--sm" data-action="install-skill" data-id="${esc(item.id)}" data-provider="${provider.id}" data-slug="${esc(item.slug)}">重装</button>`
              } else {
                side = `<button type="button" class="bz-btn bz-btn--sm bz-btn--primary" data-action="install-skill" data-id="${esc(item.id)}" data-provider="${provider.id}" data-slug="${esc(item.slug)}">安装</button>`
              }

              const conflictDetail = conflict
                ? `<details class="bz-conflict-details">
                     <summary>查看已有安装（已被 ${esc(conflict)} 安装）</summary>
                     <p>目标目录 <code class="bz-mono">.dsh/skills/${esc(item.slug)}/</code> 已由 ${esc(conflict)} 安装，跨来源同名不覆盖、不加后缀。</p>
                   </details>`
                : ''

              return `
                <div class="bz-workbench-item">
                  <div class="bz-workbench-item__main">
                    <div class="bz-workbench-item__title">
                      <span>${esc(item.name)}</span>
                      <span class="bz-mono" style="color:var(--bz-fg-dim)">${esc(item.slug)}</span>
                    </div>
                    <p class="bz-workbench-item__desc">${esc(item.desc)}</p>
                    ${conflictDetail}
                  </div>
                  <div class="bz-workbench-item__side">${side}</div>
                </div>
              `
            }

            const memSection =
              provider.capabilities.memoryMarket !== true
                ? `<div class="bz-subhead">记忆市场 <span class="bz-tag" data-kind="disabled">禁用：未声明 memoryMarket</span></div>
                   <p class="bz-workbench-item__desc" style="padding:4px 6px">该 Provider 未声明 memoryMarket 能力，不以「暂无条目」冒充空态。</p>`
                : `<div class="bz-subhead">记忆市场 <span class="bz-tag" data-kind="readonly">memoryMarket</span></div>
                   ${memSkills.map(renderSkillRow).join('') || '<p class="bz-workbench-item__desc" style="padding:4px 6px">无匹配记忆条目</p>'}`

            contentHtml = `
              <div class="bz-subhead">技能市场 <span class="bz-tag" data-kind="readonly">skillMarket</span></div>
              ${marketSkills.map(renderSkillRow).join('') || '<p class="bz-workbench-item__desc" style="padding:4px 6px">无匹配技能</p>'}
              ${memSection}
            `
          } else {
            const conns = CONNECTORS.filter(
              (x) =>
                x.providerId === provider.id &&
                (q === '' || (x.name + ' ' + x.desc).toLowerCase().includes(q)),
            )
            contentHtml =
              conns.length === 0
                ? `<div class="bz-empty-box"><div class="bz-empty-box__title">暂无连接器</div></div>`
                : conns
                    .map((item) => {
                      const authed = Boolean(state.connectorAuthed[item.id])
                      const sessionOn = !state.disabledConnectors[item.id]
                      let side = ''
                      if (item.catalogOnly) {
                        side = `<span class="bz-tag" data-kind="muted">目录只读</span><button type="button" class="bz-btn bz-btn--sm" data-action="copy-config" data-id="${esc(item.id)}">复制片段</button>`
                      } else if (!authed) {
                        side = `<span class="bz-tag" data-kind="warn">需授权</span><button type="button" class="bz-btn bz-btn--sm bz-btn--primary" data-action="auth-connector" data-id="${esc(item.id)}">授权</button>`
                      } else {
                        side = `<span class="bz-tag" data-kind="${sessionOn ? 'ok' : 'muted'}">${sessionOn ? '已启用' : '本会话停用'}</span>
                                <button type="button" class="bz-btn bz-btn--sm" data-action="toggle-connector" data-id="${esc(item.id)}">${sessionOn ? '停用' : '启用'}</button>
                                <button type="button" class="bz-btn bz-btn--sm bz-btn--ghost" data-action="copy-config" data-id="${esc(item.id)}">复制片段</button>`
                      }
                      return `
                        <div class="bz-workbench-item">
                          <div class="bz-workbench-item__main">
                            <div class="bz-workbench-item__title">${esc(item.name)} <span class="bz-tag bz-mono" data-kind="muted">${item.transport} · ${item.tools} 工具</span></div>
                            <p class="bz-workbench-item__desc">${esc(item.desc)}</p>
                          </div>
                          <div class="bz-workbench-item__side">${side}</div>
                        </div>
                      `
                    })
                    .join('')
          }

          return `
            <section class="bz-lib-card" data-muted="${!enabled}">
              <div class="bz-lib-card__head">
                <span class="bz-lib-card__name">
                  <span>${esc(provider.displayName)}</span>
                  <span class="bz-tag bz-mono" data-kind="muted">${esc(provider.id)}</span>
                </span>
                ${
                  enabled
                    ? `<span class="bz-tag" data-kind="ok">已启用</span>`
                    : `<button type="button" class="bz-btn bz-btn--sm bz-btn--accent" data-action="toggle-provider" data-provider="${provider.id}">在会话启用</button>`
                }
              </div>
              <div class="bz-lib-card__body">${contentHtml}</div>
            </section>
          `
        }

        // ===================================================================
        // Render: Screen A (Settings Page — Provider 栏 + 启用禁用 + 跟随 DSH 配色)
        // ===================================================================
        function renderSettingsScreen() {
          const provider = PROVIDERS.find((p) => p.id === state.settingsProvider) || PROVIDERS[0]
          const isError = state.previewMode === 'partial-error' && provider.id === 'demo'
          const providerOn = state.providerEnabled[provider.id] === true
          const conns = CONNECTORS.filter((c) => c.providerId === provider.id && !c.catalogOnly)

          let accountHtml = ''
          if (state.loginPhase === 'logged' && provider.id === 'workbuddy') {
            accountHtml = `
              <div class="settings-field">
                <div class="settings-field__label">认证状态 <span class="bz-tag" data-kind="ok">已认证</span> <span class="bz-tag" data-kind="readonly">只读</span></div>
                <div class="settings-field__row">
                  <span class="bz-mono">单凭证独立存储（到期 2026-12-31）</span>
                </div>
              </div>
              <div class="settings-field">
                <div class="settings-field__label">操作</div>
                <div class="settings-field__row">
                  <button type="button" class="bz-btn bz-btn--sm" data-action="finish-login">刷新凭证</button>
                  <button type="button" class="bz-btn bz-btn--sm bz-btn--danger" data-action="ask-logout">退出登录</button>
                </div>
                <p class="settings-field__hint">市场凭证独立存储在当前 Provider 专属目录，不依赖其他插件。</p>
              </div>
            `
          } else if (state.loginPhase === 'waiting') {
            accountHtml = `
              <div class="settings-field">
                <div class="settings-field__label">网页授权中 <span class="bz-tag" data-kind="info">等待确认</span></div>
                <p class="settings-field__hint">已在浏览器打开授权页：<code class="bz-mono">https://www.codebuddy.cn/login?state=bz_92f1</code></p>
                <div class="settings-field__row">
                  <button type="button" class="bz-btn bz-btn--sm bz-btn--primary" data-action="finish-login">我已完成</button>
                  <button type="button" class="bz-btn bz-btn--sm" data-action="cancel-login">取消</button>
                </div>
              </div>
            `
          } else {
            const configured = provider.credential.configured || provider.id === 'workbuddy'
            accountHtml = `
              <div class="settings-field">
                <div class="settings-field__label">认证状态 <span class="bz-tag" data-kind="empty">未认证</span></div>
                <p class="settings-field__hint">每个 Provider 仅需完成一次网页授权即可访问在线专家与技能市场（单凭证独立存储）。</p>
              </div>
              <div class="settings-field">
                <div class="settings-field__row">
                  <button type="button" class="bz-btn bz-btn--sm bz-btn--primary" data-action="start-login" ${!configured ? 'disabled' : ''}>立即登录认证</button>
                  ${!configured ? `<span class="bz-tag" data-kind="disabled">禁用：凭据未配置</span>` : ''}
                </div>
              </div>
            `
          }

          return `
            <section class="stage-settings" aria-label="设置页原型">
              <aside class="settings-nav" aria-label="宿主设置导航">
                <div class="settings-nav__item">常规</div>
                <div class="settings-nav__item">模型服务</div>
                <div class="settings-nav__item">插件管理</div>
                <div class="settings-nav__item" data-active="true">${ICONS.grid} <span>集市</span></div>
                <div class="settings-nav__item">隐私与凭据</div>
              </aside>

              <div class="settings-main">
                <div class="settings-header">
                  <div>
                    <h2>集市设置</h2>
                    <p class="settings-field__hint">配色跟随 DSH 基础设置自动适配深浅主题；以下按 Provider 分页管理。</p>
                  </div>
                  <div class="settings-field__row">
                    <span class="bz-tag" data-kind="muted">当前版本 v1.0.0</span>
                    ${
                      state.updateConfirm
                        ? `<button type="button" class="bz-btn bz-btn--sm bz-btn--primary" data-action="apply-update">确认更新到 v1.1.0</button>
                           <button type="button" class="bz-btn bz-btn--sm" data-action="cancel-update">取消</button>`
                        : `<button type="button" class="bz-btn bz-btn--sm bz-btn--accent" data-action="ask-update">发现新版本 v1.1.0 · 立即更新</button>`
                    }
                  </div>
                </div>

                <!-- Provider 栏：一个个 tab 切换到一个 Provider -->
                <div class="settings-provider-bar">
                  <span class="settings-provider-bar__label">Provider 栏</span>
                  <div class="settings-tabs" role="tablist" aria-label="Provider 栏">
                    ${PROVIDERS.map((p) => {
                      const tabErr = state.previewMode === 'partial-error' && p.id === 'demo'
                      const tabEnabled = state.providerEnabled[p.id] === true
                      return `
                        <button
                          type="button"
                          class="settings-tab"
                          role="tab"
                          aria-selected="${state.settingsProvider === p.id}"
                          data-on="${state.settingsProvider === p.id}"
                          data-disabled="${!tabEnabled}"
                          data-error="${tabErr}"
                          data-action="settings-tab"
                          data-provider="${p.id}"
                        >
                          <span>${esc(p.displayName)}</span>
                          ${
                            tabErr
                              ? '<span class="bz-tag" data-kind="error">出错</span>'
                              : `<span class="bz-tag" data-kind="${tabEnabled ? 'ok' : 'disabled'}">${tabEnabled ? '已启用' : '已禁用'}</span>`
                          }
                        </button>
                      `
                    }).join('')}
                  </div>
                </div>

                <!-- Provider 启用/禁用控制卡：禁用后不在会话面板显示 -->
                <div class="settings-provider-banner" data-enabled="${providerOn}">
                  <div class="settings-provider-banner__meta">
                    <div class="settings-provider-banner__title">
                      <span>${esc(provider.displayName)}</span>
                      <span class="bz-tag bz-mono" data-kind="muted">${esc(provider.id)}</span>
                      <span class="bz-tag" data-kind="${providerOn ? 'ok' : 'disabled'}">
                        ${providerOn ? '已启用 · 在会话面板显示' : '已禁用 · 不在会话面板显示'}
                      </span>
                    </div>
                    <p class="settings-provider-banner__desc">${esc(provider.description)}</p>
                  </div>
                  <button
                    type="button"
                    class="bz-switch-pill"
                    role="switch"
                    aria-checked="${providerOn}"
                    data-on="${providerOn}"
                    data-action="toggle-settings-provider"
                    data-provider="${provider.id}"
                  >
                    <span class="bz-switch-track" aria-hidden="true"></span>
                    <span>${providerOn ? '已启用' : '已禁用'}</span>
                  </button>
                </div>

                ${
                  isError
                    ? `<div class="settings-card">
                         <div class="bz-inline-alert" role="alert" style="margin:0">
                           <span><strong>${esc(provider.displayName)}</strong> 状态读取失败（500）：不影响其他 Provider 页签切换。</span>
                           <button type="button" class="bz-btn bz-btn--sm" data-action="recover-error">重试</button>
                         </div>
                       </div>`
                    : `<div class="settings-grid" data-muted="${!providerOn}">
                         <article class="settings-card">
                           <div class="settings-card__head">
                             <h3 class="settings-card__title">账号与登录</h3>
                             <span class="bz-tag bz-mono" data-kind="muted">${esc(provider.id)}</span>
                           </div>
                           ${accountHtml}
                         </article>

                         <article class="settings-card">
                           <div class="settings-card__head">
                             <h3 class="settings-card__title">宿主凭据</h3>
                             <span class="bz-tag" data-kind="${provider.credential.configured ? 'ok' : 'error'}">
                               ${provider.credential.configured ? '已配置' : '未配置'}
                             </span>
                           </div>
                           <div class="settings-field">
                             <div class="settings-field__label">凭证引用名 <span class="bz-tag" data-kind="readonly">只读</span></div>
                             <code class="bz-mono">${esc(provider.credential.name)}</code>
                           </div>
                           <div class="settings-field">
                             <div class="settings-field__label">凭证值</div>
                             ${
                               provider.credential.configured
                                 ? `<span class="bz-mono">${esc(provider.credential.masked)}（模式 ${esc(provider.credential.mode)} · 宿主托管）</span>`
                                 : `<p class="settings-field__hint settings-field__hint--error">错在哪：宿主凭据服务中未写入 ${esc(provider.credential.name)}。怎么改：在「隐私与凭据」新增该条目并保存。</p>`
                             }
                           </div>
                         </article>

                         <article class="settings-card">
                           <div class="settings-card__head">
                             <h3 class="settings-card__title">本地缓存</h3>
                             <span class="bz-mono">${(provider.cache.bytes / 1048576).toFixed(1)} MB · ${provider.cache.entries} 条</span>
                           </div>
                           <p class="settings-field__hint bz-mono">${esc(provider.cache.dir)}</p>
                           <div class="settings-field__row">
                             <button type="button" class="bz-btn bz-btn--sm bz-btn--danger" data-action="ask-clear-cache" ${provider.cache.bytes === 0 ? 'disabled' : ''}>清理缓存</button>
                             ${provider.cache.bytes === 0 ? '<span class="bz-tag" data-kind="disabled">禁用：当前无缓存</span>' : ''}
                           </div>
                         </article>

                         <article class="settings-card">
                           <div class="settings-card__head">
                             <h3 class="settings-card__title">连接器授权</h3>
                             <span class="bz-tag" data-kind="muted">${conns.length} 项</span>
                           </div>
                           <ul class="settings-list">
                             ${conns
                               .map((c) => {
                                 const authed = Boolean(state.connectorAuthed[c.id])
                                 return `
                                   <li>
                                     <div>
                                       <div style="font-weight:600">${esc(c.name)} <span class="bz-tag bz-mono" data-kind="muted">${c.transport} · ${c.tools}</span></div>
                                       <div class="settings-field__hint">${esc(c.desc)}</div>
                                     </div>
                                     <div class="settings-field__row">
                                       <span class="bz-tag" data-kind="${authed ? 'ok' : 'warn'}">${authed ? '已授权' : '需授权'}</span>
                                       ${
                                         authed
                                           ? `<button type="button" class="bz-btn bz-btn--sm" data-action="copy-config" data-id="${c.id}">复制配置片段</button>
                                              <button type="button" class="bz-btn bz-btn--sm bz-btn--danger" data-action="ask-revoke" data-id="${c.id}">清除授权</button>`
                                           : `<button type="button" class="bz-btn bz-btn--sm bz-btn--primary" data-action="auth-connector" data-id="${c.id}">授权</button>`
                                       }
                                     </div>
                                   </li>
                                 `
                               })
                               .join('')}
                           </ul>
                         </article>
                       </div>`
                }
              </div>
            </section>
          `
        }

        function renderConfirmDialog() {
          if (!state.confirmModal) return ''
          const c = state.confirmModal
          return `
            <div class="bz-modal-scrim" data-action="cancel-confirm" role="presentation">
              <div class="bz-modal" style="width:min(440px,100%);" role="dialog" aria-modal="true" aria-label="${esc(c.title)}">
                <div class="bz-modal__head">
                  <h3 class="bz-modal__title">${esc(c.title)}</h3>
                  <button type="button" class="bz-icon-close" data-action="cancel-confirm" aria-label="取消">${ICONS.close}</button>
                </div>
                <div class="bz-modal__body">
                  <p style="margin:0;color:var(--bz-fg-secondary)">${esc(c.body)}</p>
                </div>
                <div class="bz-modal__foot" style="justify-content:flex-end">
                  <button type="button" class="bz-btn bz-btn--sm" data-action="cancel-confirm">取消</button>
                  <button type="button" class="bz-btn bz-btn--sm bz-btn--danger" data-action="run-confirm">${esc(c.confirmLabel)}</button>
                </div>
              </div>
            </div>
          `
        }

        function renderToast() {
          const root = document.getElementById('toast-root')
          root.innerHTML = state.toast
            ? `<div class="bz-toast-floating" data-kind="${state.toast.kind}" role="status">${esc(state.toast.text)}</div>`
            : ''
        }

        function render() {
          document.body.setAttribute(
            'data-ds-dark-theme',
            state.theme === 'dark' ? 'true' : 'false',
          )
          document.querySelectorAll('[data-screen]').forEach((el) => {
            el.setAttribute('data-active', el.getAttribute('data-screen') === state.screen)
          })
          document.querySelectorAll('[data-theme-btn]').forEach((el) => {
            el.setAttribute('data-active', el.getAttribute('data-theme-btn') === state.theme)
          })
          document.querySelectorAll('[data-mode]').forEach((el) => {
            el.setAttribute('data-active', el.getAttribute('data-mode') === state.previewMode)
          })

          const app = document.getElementById('app')
          const modalRoot = document.getElementById('modal-root')

          const activeEl = document.activeElement
          const activeRole = activeEl ? activeEl.getAttribute('data-role') : null
          const caret =
            activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null

          app.innerHTML =
            state.screen === 'conversation' ? renderConversationScreen() : renderSettingsScreen()
          modalRoot.innerHTML = state.confirmModal ? renderConfirmDialog() : renderFullModal()
          renderToast()

          if (activeRole) {
            const nextInput = document.querySelector(`[data-role="${activeRole}"]`)
            if (nextInput) {
              nextInput.focus()
              if (caret !== null && typeof nextInput.setSelectionRange === 'function') {
                nextInput.setSelectionRange(caret, caret)
              }
            }
          }
        }

        document.addEventListener('click', (event) => {
          const screenBtn = event.target.closest('[data-screen]')
          if (screenBtn) {
            state.screen = screenBtn.getAttribute('data-screen')
            render()
            return
          }

          const themeBtn = event.target.closest('[data-theme-btn]')
          if (themeBtn) {
            state.theme = themeBtn.getAttribute('data-theme-btn')
            render()
            return
          }

          const modeBtn = event.target.closest('[data-mode]')
          if (modeBtn) {
            state.previewMode = modeBtn.getAttribute('data-mode')
            render()
            return
          }

          const pillBtn = event.target.closest('.bz-pill-btn[data-kind]')
          if (pillBtn) {
            const nextKind = pillBtn.getAttribute('data-kind')
            state.activeKind = state.activeKind === nextKind ? null : nextKind
            state.category = 'all'
            state.searchQuery = ''
            render()
            return
          }

          const actionEl = event.target.closest('[data-action]')
          if (actionEl) {
            const action = actionEl.getAttribute('data-action')
            if (action === 'toggle-settings-provider') {
              const id = actionEl.getAttribute('data-provider')
              const next = !state.providerEnabled[id]
              state.providerEnabled[id] = next
              if (next && !state.activeProviders.includes(id)) state.activeProviders.push(id)
              showToast(
                next
                  ? `已启用 Provider「${providerName(id)}」，将在会话面板显示`
                  : `已禁用 Provider「${providerName(id)}」，会话面板不再显示`,
              )
              render()
              return
            }
            if (action === 'goto-settings') {
              state.modalOpen = false
              state.screen = 'settings'
              render()
              return
            }
            if (action === 'toggle-provider') {
              const id = actionEl.getAttribute('data-provider')
              const idx = state.activeProviders.indexOf(id)
              if (idx === -1) state.activeProviders.push(id)
              else state.activeProviders.splice(idx, 1)
              showToast(
                sessionActiveProviderIds().length === 0
                  ? '已清空当前会话来源筛选'
                  : `当前会话已选 ${sessionActiveProviderIds().length} 个来源`,
              )
              render()
              return
            }
            if (action === 'enable-default-provider') {
              const first = enabledProvidersInSettings()[0]
              if (first) state.activeProviders = [first.id]
              state.previewMode = 'normal'
              render()
              return
            }
            if (action === 'set-category') {
              state.category = actionEl.getAttribute('data-category')
              render()
              return
            }
            if (action === 'reset-filters') {
              state.category = 'all'
              state.searchQuery = ''
              state.previewMode = 'normal'
              render()
              return
            }
            if (action === 'recover-error') {
              state.previewMode = 'normal'
              showToast('Demo Provider 已恢复连接')
              render()
              return
            }
            if (action === 'open-modal') {
              state.modalTab = state.activeKind || 'expert'
              state.modalOpen = true
              state.activeKind = null
              render()
              return
            }
            if (action === 'open-modal-connector') {
              state.modalTab = 'connector'
              state.modalOpen = true
              state.activeKind = null
              render()
              return
            }
            if (action === 'close-modal') {
              state.modalOpen = false
              render()
              return
            }
            if (action === 'close-modal-backdrop' && event.target === actionEl) {
              state.modalOpen = false
              render()
              return
            }
            if (action === 'modal-tab') {
              state.modalTab = actionEl.getAttribute('data-tab')
              render()
              return
            }
            if (action === 'pick-expert') {
              const id = actionEl.getAttribute('data-id')
              const pId = actionEl.getAttribute('data-provider')
              const found = EXPERTS.find((e) => e.id === id && e.providerId === pId)
              if (found) {
                state.selectedExpert = { providerId: pId, id: found.id, name: found.name }
                showToast(`已选用 ${providerName(pId)} · ${found.name}（下一条消息生效）`)
                render()
              }
              return
            }
            if (action === 'clear-expert') {
              state.selectedExpert = null
              showToast('已退出当前专家，恢复默认助手')
              render()
              return
            }
            if (action === 'install-skill') {
              const pId = actionEl.getAttribute('data-provider')
              const slug = actionEl.getAttribute('data-slug')
              const already = Boolean(state.installedSkills[pId + ':' + slug])
              state.installedSkills[pId + ':' + slug] = true
              showToast(`${already ? '已重装' : '已安装'}技能 ${slug}`)
              render()
              return
            }
            if (action === 'toggle-connector') {
              const id = actionEl.getAttribute('data-id')
              state.disabledConnectors[id] = !state.disabledConnectors[id]
              showToast(
                state.disabledConnectors[id] ? '已在本会话停用连接器' : '已在本会话启用连接器',
              )
              render()
              return
            }
            if (action === 'auth-connector') {
              const id = actionEl.getAttribute('data-id')
              state.connectorAuthed[id] = true
              state.disabledConnectors[id] = false
              showToast('连接器已完成授权并启用')
              render()
              return
            }
            if (action === 'copy-config') {
              showToast('已复制 MCP 配置片段（只产出文本，不改宿主配置）')
              return
            }
            if (action === 'settings-tab') {
              state.settingsProvider = actionEl.getAttribute('data-provider')
              render()
              return
            }
            if (action === 'start-login') {
              state.regionError = false
              state.loginPhase = 'waiting'
              render()
              return
            }
            if (action === 'finish-login') {
              state.loginPhase = 'logged'
              showToast('登录成功：已保存账号凭证')
              render()
              return
            }
            if (action === 'cancel-login') {
              state.loginPhase = 'logged-out'
              render()
              return
            }
            if (action === 'ask-logout') {
              state.confirmModal = {
                title: '退出 ' + providerName(state.settingsProvider) + ' 账号',
                body: '将删除该 Provider 账号目录下的登录记录，之后需重新扫码；当前会话专家选择不受影响。',
                confirmLabel: '确认退出',
                onRun: () => {
                  state.loginPhase = 'logged-out'
                  showToast('已退出登录')
                },
              }
              render()
              return
            }
            if (action === 'ask-clear-cache') {
              state.confirmModal = {
                title: '清理本地缓存',
                body: '将删除当前 Provider 的 18 个缓存条目（2.4 MB），下次访问需重新拉取。',
                confirmLabel: '清理缓存',
                onRun: () => {
                  PROVIDERS[0].cache.bytes = 0
                  PROVIDERS[0].cache.entries = 0
                  showToast('已清理 2.4 MB 缓存')
                },
              }
              render()
              return
            }
            if (action === 'ask-revoke') {
              const id = actionEl.getAttribute('data-id')
              state.confirmModal = {
                title: '清除连接器授权',
                body: '移除后该连接器的工具随即不可用，需要时须重新授权。',
                confirmLabel: '移除授权',
                onRun: () => {
                  state.connectorAuthed[id] = false
                  showToast('已清除连接器授权')
                },
              }
              render()
              return
            }
            if (action === 'ask-update') {
              state.updateConfirm = true
              render()
              return
            }
            if (action === 'cancel-update') {
              state.updateConfirm = false
              render()
              return
            }
            if (action === 'apply-update') {
              state.updateConfirm = false
              showToast('已提交更新到 v1.1.0，重启 DSH 后生效')
              return
            }
            if (
              action === 'cancel-confirm' &&
              (event.target === actionEl || actionEl.tagName === 'BUTTON')
            ) {
              state.confirmModal = null
              render()
              return
            }
            if (action === 'run-confirm') {
              const fn = state.confirmModal && state.confirmModal.onRun
              state.confirmModal = null
              if (fn) fn()
              render()
              return
            }
          }

          const row = event.target.closest('.bz-doubao-row[data-row-kind="expert"]')
          if (row && !event.target.closest('button')) {
            const id = row.getAttribute('data-id')
            const pId = row.getAttribute('data-provider')
            const found = EXPERTS.find((e) => e.id === id && e.providerId === pId)
            if (found) {
              state.selectedExpert = { providerId: pId, id: found.id, name: found.name }
              showToast(`已选用 ${providerName(pId)} · ${found.name}`)
              render()
            }
          }
        })

        document.addEventListener('input', (event) => {
          const role = event.target.getAttribute('data-role')
          if (role === 'popover-search') {
            state.searchQuery = event.target.value
            render()
          } else if (role === 'modal-search') {
            state.modalSearchQuery = event.target.value
            render()
          }
        })

        document.addEventListener('change', (event) => {
          if (event.target.getAttribute('data-role') === 'region-select') {
            state.loginRegion = event.target.value
            state.regionError = false
            render()
          }
        })

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            if (state.confirmModal) {
              state.confirmModal = null
              render()
            } else if (state.modalOpen) {
              state.modalOpen = false
              render()
            } else if (state.activeKind) {
              state.activeKind = null
              render()
            }
          }
        })

        render()
      })()
